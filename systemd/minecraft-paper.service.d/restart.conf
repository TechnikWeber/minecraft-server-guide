# Optional: /stop oder /restart im Spiel -> der Server kommt nach wenigen
# Sekunden von selbst wieder. "systemctl stop minecraft-paper" haelt ihn
# weiterhin richtig an.
#   mkdir -p /etc/systemd/system/minecraft-paper.service.d
#   cp systemd/minecraft-paper.service.d/restart.conf /etc/systemd/system/minecraft-paper.service.d/
#   systemctl daemon-reload
[Service]
Restart=always
RestartSec=5
